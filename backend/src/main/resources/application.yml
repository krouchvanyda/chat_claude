spring:
  application:
    name: chat-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/chatapp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      pool-name: ChatHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:10MB}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:5001}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}

app:
  # Directory (relative to the working dir) where profile images are stored,
  # served at /uploads/** (replaces the original Multer "uploads/" target).
  upload-dir: ${UPLOAD_DIR:uploads}
  # netty-socketio runs its own server, separate from Tomcat, so it needs its own port.
  # Point the mobile client's socket connection at this port (e.g. http://<host>:5002).
  socketio:
    host: ${SOCKETIO_HOST:0.0.0.0}
    port: ${SOCKETIO_PORT:5002}

logging:
  level:
    root: INFO
    com.chatapp: DEBUG
